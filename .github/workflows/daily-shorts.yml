name: KYES daily map videos (Wars, English)

on:
  # Started on time by cron-job.org (GitHub's own schedule is often late), or by hand from the Actions tab.
  workflow_dispatch:
    inputs:
      force:
        description: "Run now even outside the 3 daily slots"
        type: boolean
        default: false
      topic:
        description: "Optional topic id or name from maps/topics.json (leave empty for the next one)"
        required: false
        default: ""
      upload:
        description: "Upload to YouTube"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: kyes-daily
  cancel-in-progress: false

jobs:
  # 3 videos a day (Malaysia time 2:50am, 8:50am, 12:50pm). Any other call stops here in a few seconds.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.slot.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - id: slot
        run: |
          H=$(TZ=Asia/Kuala_Lumpur date -d '-20 min' +%H)
          GO=0
          for S in 02 08 12; do [ "$H" = "$S" ] && GO=1; done
          # cron-job.org may call at :45 and/or :50: if a video was already made in the last hour, skip (no doubles)
          LAST=$(git log -1 --format=%ct -- history.json 2>/dev/null || echo 0)
          AGE=$(( $(date +%s) - ${LAST:-0} ))
          if [ "$GO" = "1" ] && [ "$AGE" -lt 3600 ]; then echo "a video was made $AGE s ago, skipping"; GO=0; fi
          [ "${{ inputs.force }}" = "true" ] && GO=1
          echo "slot hour $H -> go=$GO"
          echo "go=$GO" >> "$GITHUB_OUTPUT"

  # The map videos are made with the Empire Maps engine (a fixed, tested version of its code) plus this
  # channel's own topics and script writer in maps/. The old horror code stays in this repo, unused.
  make-and-upload:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Kuala_Lumpur
      FFMPEG_PATH: ffmpeg
      PYTHON: python
      PRIVACY: public
      YT_CATEGORY: "27"
      YT_LANG: en
      MAP_KIND: wars-en
      CHANNEL_NAME: "War Maps"
      BRAND: "WAR MAPS"
      OUTRO_SUB: "Tell me in the comments"
      OUTRO: "WHICH WAR NEXT?"
      GEMINI_TEXT_MODEL: gemini-3.8-flash
      GEMINI_TTS_MODEL: gemini-3.8-flash-tts
      GEMINI_TTS_VOICE: Orus,Charon
      VOICE_PITCH: "0.97"
      VOICE_PACE: "1.03"
      ENGINE_SHA: 2b676f22080b83d1a3a6e84d693d1c17fd3a44b5
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install drawing and music tools
        run: pip install -q pillow numpy
      - name: Get the map engine and add this channel's files
        run: |
          git clone -q https://github.com/shehrozimtiaz0797-7/empire-maps-pipeline engine
          git -C engine checkout -q "$ENGINE_SHA"
          cp maps/topics.json engine/topics.json
          cp maps/script.js engine/src/script.js
          rm -f engine/history.json
          [ -f history.json ] && cp history.json engine/history.json
          cd engine
          sed -i 's/"EMPIRE MAPS"/os.environ.get("BRAND", "EMPIRE MAPS")/; s/"WHICH EMPIRE NEXT?"/os.environ.get("OUTRO", "WHICH EMPIRE NEXT?")/; s/"Tell me in the comments"/os.environ.get("OUTRO_SUB", "Tell me in the comments")/' src/render.py
          sed -i 's/            lab = topic\["label"\]/            lab = (topic.get("labels") or {}).get(str(y_now), topic["label"])/' src/render.py
          sed -i 's/const text = script.lines.map/const text = (script.speak || script.lines).map/' src/voice.js
          sed -i "s/'en',/(process.env.YT_LANG || 'en'),/g" src/youtube.js
          grep -q 'os.environ.get("BRAND"' src/render.py && grep -q 'OUTRO_SUB' src/render.py && grep -q 'topic.get("labels")' src/render.py && grep -q 'script.speak' src/voice.js && grep -q 'YT_LANG' src/youtube.js
          python3 ../maps/theme.py src/render.py war
      - name: Keep the border maps between runs
        uses: actions/cache@v4
        with:
          path: engine/data
          key: borders-v1
      - name: Make and upload a Short
        working-directory: engine
        env:
          TOPIC: ${{ inputs.topic }}
          DO_UPLOAD: ${{ inputs.upload }}
        run: |
          set --
          if [ -n "$TOPIC" ]; then set -- "$@" --topic "$TOPIC"; fi
          if [ "$DO_UPLOAD" = "false" ]; then set -- "$@" --no-upload; fi
          node make-video.js "$@"
      - name: Save history (so topics are not repeated)
        if: always()
        run: |
          if [ -f engine/history.json ]; then
            if [ "${{ inputs.upload }}" = "false" ]; then python3 -c "
          import json; h=json.load(open('engine/history.json')); json.dump([x for x in h if x.get('videoId') or 'kind' not in x and 'years' not in x], open('engine/history.json','w'), indent=2)"; fi
            cp engine/history.json history.json
            git config user.name "maps-bot"
            git config user.email "maps-bot@users.noreply.github.com"
            git add history.json
            git commit -m "Update history $(date +'%Y-%m-%d %H:%M')" || echo "Nothing to save"
            git pull --rebase || true
            git push || echo "Could not save history"
          fi
      - name: Save a preview for checking (qa branch, newest video only)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D=$(ls -d engine/output/*/ 2>/dev/null | tail -1)
          if [ -z "$D" ] || [ ! -f "$D/final.mp4" ]; then echo "no video"; exit 0; fi
          mkdir -p /tmp/qa
          cp "$D/final.mp4" "$D/script.json" "$D/render.json" "$D/voice.wav" /tmp/qa/ 2>/dev/null || true
          cp engine/logs/pipeline.log /tmp/qa/ 2>/dev/null || true
          cd /tmp/qa
          git init -q -b qa
          git add .
          git -c user.name=maps-bot -c user.email=maps-bot@users.noreply.github.com commit -qm "preview $(date +'%Y-%m-%d %H:%M')"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" qa || echo "could not save preview"
